[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binscope"
version = "0.3.0"
description = "Understand quickly what a Linux ELF or Windows PE binary expects and what it really does."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kadohack12" }]
keywords = ["security", "malware-analysis", "reverse-engineering", "ctf", "elf", "pe", "strace", "ltrace", "speakeasy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["rich>=12.0", "pefile>=2023.2.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
pe = ["speakeasy-emulator>=1.5"]

[project.scripts]
binscope = "binscope.cli:main"

[tool.setuptools.packages.find]
include = ["binscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
