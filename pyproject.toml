[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binscope"
version = "0.1.0"
description = "Understand quickly what a Linux ELF binary expects and what it really does."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "binscope" }]
dependencies = ["rich>=12.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
binscope = "binscope.cli:main"

[tool.setuptools.packages.find]
include = ["binscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
